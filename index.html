 награда."]}]},{id:"drop-it",title:"Команда «Дай» с обменом",category:"Подбор с земли",problem:"pickup",goal:"Собака охотно отпускает предмет из пасти в обмен на ценную награду — без насильственного извлечения.",difficulty:1,durationMin:3,equipment:["Две одинаковые игрушки или игрушка + очень ценное лакомство"],steps:["Дай собаке малоценную игрушку и немного поиграй.","Поднеси к носу очень ценное лакомство и скажи «Дай».","Как только собака разожмёт пасть — «Да!», отдай лакомство.","Верни игрушку: собака должна понять, что «Дай» не означает «потерять навсегда».","Никогда не разжимай пасть руками и не гоняйся за собакой с предметом — это учит убегать.","Неудача — если собака не отпустила предмет за 5 секунд. Не тяни: предложи лакомство ценнее или простую игрушку."],mistakes:["Вытаскивать предмет силой","Гоняться за собакой","Обмен только на «запретные» предметы — собака начнёт прятать находки","Слабая награда за ценный предмет"],stressSigns:[...Ft,"Застывает над предметом, рычит, убегает с ним"],successCriterion:"Собака отпускает предмет в течение 3 секунд после «Дай».",progression:"Две сессии от 80% — переходи к более ценному предмету или другому месту.",simplify:"Менее ценная игрушка, более ценная награда, тихое место дома.",harder:"Ценная игрушка, затем обмен на прогулке, затем обмен безопасной находки (палка, шишка).",measurement:"attempts",unit:qa,successLabel:"Отдала",failLabel:"Не отдала",perUnitMin:.5,minEvaluated:5,safety:["Если собака рычит или застывает над предметом — прекрати упражнение и обратись к специалисту по поведению."],levels:[{n:1,title:"Малоценная игрушка дома",changes:"Базовый уровень",steps:["Дай игрушку, немного поиграй.","Ценное лакомство к носу — «Дай».","Отпустила — «Да!», лакомство, игрушку верни."]},{n:2,title:"Любимая игрушка",changes:"Ценность предмета",steps:["Любимая игрушка, короткая игра.","«Дай» и самое ценное лакомство.","Верни игрушку и продолжи игру."]},{n:3,title:"Обмен на прогулке",changes:"Место: улица",steps:["Возьми игрушку на прогулку.","«Дай» в тихом месте.","Награда и возврат игрушки."]},{n:4,title:"Безопасная находка",changes:"Предмет: палка, шишка",steps:["Собака подобрала палку или шишку.","«Дай» и сразу очень ценная награда.","Не ругай за находку — хвали за обмен."]}]},{id:"attention-switch",title:"Переключение внимания на хозяина",category:"Отвлечения",problem:"distractions",goal:"Собака может оторваться от интересного и переключиться на хозяина по кличке.",difficulty:2,durationMin:4,equipment:["Ценное лакомство","Игрушка-отвлечение"],steps:["Дождись, когда собака увлечётся чем-то (запах, игрушка на полу, человек вдалеке).","Произнеси кличку один раз.","Повернулась к тебе — «Да!», награда у твоей ноги или брось лакомство в сторону от раздражителя.","Не повернулась за 3 секунды — «Не получилось». Сделай шаг назад или отойди от раздражителя.","Иногда после награды отпускай собаку обратно к интересному: так переключение становится выгодным."],mistakes:["Звать, когда раздражитель слишком близко","Повторять кличку","Звать только чтобы уйти с интересного места"],stressSigns:[...Ft,...kl],successCriterion:"Собака поворачивается к хозяину в течение 3 секунд после клички.",progression:"Две сессии подряд от 80% при 8 попытках — можно усложнить отвлечение или место.",simplify:"Слабее отвлечение, больше дистанция, ценнее награда.",harder:"Отвлечение ближе или интереснее, либо новое место — по одному.",measurement:"attempts",unit:Z2,successLabel:"Переключилась",failLabel:"Не переключилась",perUnitMin:.45,minEvaluated:8,levels:[{n:1,title:"Дома, слабое отвлечение",changes:"Базовый уровень",steps:["Положи игрушку на пол в 2 м.","Собака смотрит на неё — кличка.","Повернулась — «Да!» и награда."]},{n:2,title:"Тихое место на улице",changes:"Место: двор",steps:["Дай собаке увлечься запахом.","Кличка один раз.","Повернулась — «Да!» и награда."]},{n:3,title:"Люди вдалеке",changes:"Отвлечение: прохожие на дистанции",steps:["Встань на комфортной дистанции от людей.","Собака смотрит — кличка.","Повернулась — «Да!» и награда в сторону от людей."]},{n:4,title:"Собака на комфортной дистанции",changes:"Отвлечение: другая собака",steps:["Найди дистанцию, где собака замечает, но спокойна.","Кличка — «Да!» — награда.","Не слышит — отойди дальше."]},{n:5,title:"Движущиеся раздражители",changes:"Отвлечение: бегуны, велосипеды, играющие собаки",steps:["Только на дистанции, где собака думает.","Кличка — переключение — щедрая награда.","Стресс — уходим."]}]},{id:"calm-dogs",title:"Спокойная реакция на других собак",category:"Отвлечения",problem:"distractions",goal:"Собака спокойно замечает других собак и сама переключается на хозяина.",difficulty:3,durationMin:8,equipment:["Шлейка","Поводок","Очень ценное лакомство"],steps:["Найди место, где другие собаки видны издалека (край парка, площадка через дорогу).","Встань на дистанции, где твоя собака замечает другую собаку, но остаётся спокойной и берёт лакомство.","Собака посмотрела на другую собаку спокойно — «Да!» и награда. Так взгляд на собаку становится сигналом «посмотри на хозяина».","Через несколько повторов собака начнёт сама поворачиваться к тебе после взгляда — награждай особенно щедро.","Отметь в приложении дистанцию, реакцию и удалось ли переключиться.","Появился лай, рывок, замирание — увеличь дистанцию. Не подходи ближе и не заставляй смотреть.","Если подходящих собак не было — отметь «Не было встреч». Это не неудача."],mistakes:["Подходить ближе, «чтобы привыкала»","Ругать за лай","Работать дольше, чем собака сохраняет спокойствие","Позволять незнакомым собакам подходить вплотную"],stressSigns:[...Ft,...kl],successCriterion:"Собака видит другую собаку без лая, рывка и замирания и переключается на хозяина.",progression:"Две сессии подряд от 80% спокойных наблюдений без сильных реакций — можно немного усложнить один параметр: длительность наблюдения или движение раздражителя.",simplify:"Увеличь дистанцию, выбирай неподвижных собак, сократи время наблюдения.",harder:"Сначала дольше наблюдать на той же дистанции,  своей ноги.","Собака развернулась вслед за тобой без натяжения — «Да!» и награда через 2–3 шага.","Неудача — если пришлось тянуть собаку поводком. Не тяни: остановись и позови голосом.","Когда навык надёжен в спокойных условиях, используй его при появлении раздражителя."],mistakes:["Разворачивать рывком поводка","Использовать впервые сразу при встрече с собакой","Ругать, если собака замешкалась"],stressSigns:Ft,successCriterion:"Собака разворачивается вслед за хозяином в течение 2 секунд без натяжения поводка.",progression:"Две сессии от 80% при 5 повторах — переходи в обстановку на ступень сложнее.",simplify:"Вернись в коридор или тихий двор, подсказывай рукой с лакомством.",harder:"Неожиданный разворот на прогулке, затем — при раздражителе вдалеке.",measurement:"attempts",unit:qa,successLabel:"Развернулась",failLabel:"Не получилось",perUnitMin:.45,minEvaluated:5,levels:[{n:1,title:"Дома в коридоре",changes:"Базовый уровень",steps:["Идите по коридору.","«Назад» и разворот с лакомством у ноги.","Развернулась — «Да!» и награда."]},{n:2,title:"Тихое место на улице",changes:"Место: улица без людей",steps:["Идите по пустой дорожке.","«Назад» — разворот.","«Да!» и награда через 2–3 шага."]},{n:3,title:"Неожиданно на прогулке",changes:"Время сигнала: без подготовки",steps:["Обычная прогулка, без предупреждения.","«Назад» — разворот.","Щедрая награда."]},{n:4,title:"При раздражителе вдалеке",changes:"Отвлечение: раздражитель на комфортной дистанции",steps:["Заметила собаку или человека вдалеке?","«Назад» — уходим.","«Да!» и награда после разворота."]}]},{id:"recall",title:"Подзыв «Ко мне»",category:"Подзыв",problem:"general",goal:"Собака быстро и охотно возвращается по команде «Ко мне», в том числе при отвлечениях.",difficulty:2,durationMin:4,equipment:["Шлейка","Длинный поводок 5–10 м","Очень ценное лакомство или игрушка"],steps:["На улице — только длинный поводок, закреплённый к шлейке, пока подзыв не надёжен.","Скажи «Ко мне» один раз радостным голосом, можешь присесть или отбежать назад.","Собака подбежала — «Да!» и награда у тебя в руках, лучше несколько лакомств подряд или игра.","Иногда возьми за шлейку на секунду и отпусти обратно гулять: подзыв не должен означать конец прогулки.","Неудача — если собака не пошла к тебе за 3 секунды. Не повторяй команду — подойди ближе, заинтересуй и попробуй в более простых условиях.","Никогда не наказывай за возвращение, даже если ждал долго."],mistakes:["Звать, когда собака точно не придёт","Ругать после возвращения","Звать только чтобы пристегнуть и уйти домой","Отпускать без поводка до надёжного навыка"],stressSigns:Ft,successCriterion:"Собака подбегает к хозяину в течение 3 секунд после одного сигнала.",progression:"Две сессии подряд от 80% при 5 повторах — увеличь дистанцию или добавь слабое отвлечение (одно).",simplify:"Короче дистанция, тихое место, награда ценнее, позови в момент, когда собака и так смотрит на тебя.",harder:"Длиннее поводок, затем слабые отвлечения, затем умеренные — всегда на длинном поводке.",measurement:"attempts",unit:qa,successLabel:"Пришла",failLabel:"Не пришла",perUnitMin:.6,minEvaluated:5,safety:["На улице — длинный поводок и шлейка, пока нет надёжного подзыва и безопасного огороженного места. Не пристёгивай длинный поводок к ошейнику."],levels:[{n:1,title:"Тихое место, 2–3 м",changes:"Базовый уровень",steps:["Отойди на 2–3 м.","«Ко мне» один раз.","Пришла — «Да!» и щедрая награда."]},{n:2,title:"Длинный поводок 5 м",changes:"Дистанция: до 5 м",steps:["Длинный поводок к шлейке.","Дай отойти на 5 м, «Ко мне».","Награда и иногда — «Гуляй!» обратно."]},{n:3,title:"Длинный поводок 10 м",changes:"Дистанция: до 10 м",steps:["Собака гуляет на 10 м.","«Ко мне», можно отбежать назад.","Пришла — игра или 3 лакомства подряд."]},{n:4,title:"Слабые отвлечения",changes:"Отвлечение: запахи, люди вдалеке",steps:["Зови, когда собака нюхает.","Один сигнал, радостно.","Пришла — джекпот."]},{n:5,title:"Умеренные отвлечения",changes:"Отвлечение: собаки и люди на дистанции",steps:["Только на длинном поводке.","Зови, пока раздражитель далеко.","Не пришла — проще, а не громче."]}]},{id:"wait",title:"Выдержка «Жди»",category:"Самоконтроль",problem:"general",goal:"Собака спокойно остаётся на месте, пока хозяин не даст разрешение.",difficulty:1,durationMin:3,equipment:["Лакомство"],steps:["Посади или положи собаку, скажи «Жди», покажи ладонь.","Нажми «Старт» в приложении и выдержи паузу, указанную в плане.","Если собака осталась на месте — подойди, «Да!» и награда, затем слово-разрешение («Можно»).","Встала раньше времени — «Встала раньше», спокойно верни на место и сократи время.","Увеличивай по одному: время, расстояние или отвлечения."],mistakes:["Увеличивать время и расстояние одновременно","Звать собаку из выдержки (это путает с подзывом)","Забывать слово-разрешение"],stressSigns:Ft,successCriterion:"Собака остаётся на месте всю заданную выдержку.",progression:"Две сессии подряд от 80% — увеличь время выдержки на несколько секунд.",simplify:"Сократи время вдвое, стой ближе, тренируйся дома.",harder:"Дольше, затем шаг назад, затем лёгкие отвлечения — по одному.",measurement:"duration",unit:qa,successLabel:"Выдержала",failLabel:"Встала раньше",perUnitMin:.4,minEvaluated:5,levels:[{n:1,title:"5 секунд рядом",changes:"Базовый уровень",seconds:5,steps:["«Жди», ладонь.","Выдержи 5 секунд рядом.","«Да!», награда, «Можно»."]},{n:2,title:"10 секунд",changes:"Время",seconds:10,steps:["«Жди».","10 секунд рядом.","Награда и разрешение."]},{n:3,title:"20 секунд",changes:"Время",seconds:20,steps:["«Жди».","20 секунд, ты рядом.","Награда и разрешение."]},{n:4,title:"30 секунд, шаг назад",changes:"Расстояние: 1–3 шага",seconds:30,steps:["«Жди», сделай 1–3 шага назад.","Выдержи 30 секунд.","Вернись к собаке, «Да!», награда."]},{n:5,title:"На улице при отвлечениях",changes:"Место: улица",seconds:30,steps:["Тихое место на улице.","«Жди» 30 секунд.","Вернись, награда, «Можно»."]}]},{id:"place",title:"Команда «Место»",category:"Самоконтроль",problem:"general",goal:"Собака идёт на коврик или лежанку и спокойно лежит там.",difficulty:2,durationMin:4,equipment:["Коврик или лежанка","Лакомство"],steps:["Положи коврик, подведи собаку к нему лакомством.","Любое касание коврика лапами — «Да!» и награда на коврике.","Когда собака сама встаёт на коврик, добавь слово «Место» и жди, пока ляжет.","Нажми «Старт» и выдерживай время, награждая спокойное лежание.","Встала с коврика без разрешения — «Встала раньше», спокойно верни."],mistakes:["Слишком долгое время в начале","Отправлять на место в наказание","Забывать разрешение уйти"],stressSigns:Ft,successCriterion:"Собака лежит на месте всё заданное время.",progression:"Две сессии от 80% — увеличь время или добавь бытовое отвлечение.",simplify:"Короче время, награждай чаще, ты ближе.",harder:"Дольше, затем отойди, затем бытовые отвлечения.",measurement:"duration",unit:qa,successLabel:"Лежала",failLabel:"Встала раньше",perUnitMin:.8,minEvaluated:5,levels:[{n:1,title:"Зайти на коврик",changes:"Базовый уровень",seconds:5,steps:["Подведи к коврику.","Касание — «Да!» и награда.","Повтори."]},{n:2,title:"Лечь на 10 секунд",changes:"Время",seconds:10,steps:["«Место».","Легла — выдержи 10 секунд.","Награда на коврике."]},{n:3,title:"30 секунд, ты рядом",changes:"Время",seconds:30,steps:["«Место».","30 секунд, награждай спокойствие.","Разрешение."]},{n:4,title:"1 минута, ты отходишь",changes:"Расстояние",seconds:60,steps:["«Место».","Отойди на 2–3 шага.","Вернись и награди."]},{n:5,title:"2 минуты с бытовыми отвлечениями",changes:"Отвлечения дома",seconds:120,steps:["«Место».","Занимайся делами рядом.","Награждай спокойное лежание."]}]},{id:"treat-search",title:"Поиск лакомств",category:"Интеллект",problem:"general",goal:"Нюхательная работа успокаивает, утомляет «головой» и даёт собаке законный способ искать еду.",difficulty:1,durationMin:5,equipment:["Лакомство или часть корма","Нюхательный коврик (по желанию)"],steps:["Скажи «Ищи» и разложи несколько лакомств на виду.","Когда собака находит их уверенно, прячь сложнее: в траву, под коробку, в нюхательный коврик.","Раунд удачен, если собака нашла всё сама за 1–2 минуты.","Это спокойное занятие: не торопи и не подсказывай без необходимости.","На улице раскладывай только своё лакомство на чистом участке."],mistakes:["Слишком сложные тайники в начале","Подсказывать каждое лакомство","Раскладывать там, где есть мусор"],stressSigns:Ft,successCriterion:"Собака находит все лакомства самостоятельно за 1–2 минуты.",progression:"Две сессии от 80% — усложни тайники или площадь поиска.",simplify:"Лакомства на виду, меньшая площадь.",harder:"Тайники сложнее, затем поиск на улице.",measurement:"attempts",unit:tv,successLabel:"Нашла всё",failLabel:"Не нашла",perUnitMin:1.5,minEvaluated:3,levels:[{n:1,title:"Лакомства на виду",changes:"Базовый уровень",steps:["Разложи 5–6 лакомств на полу.","«Ищи».","Нашла все — хвали."]},{n:2,title:"Коврик или трава",changes:"Сложность тайника",steps:["Лакомства в нюхательном коврике или траве.","«Ищи».","Не подсказывай."]},{n:3,title:"Спрятанные в комнате",changes:"Площадь: комната",steps:["Спрячь 5 лакомств в комнате.","«Ищи».","Хвали за каждую находку."]},{n:4,title:"Площадка на улице",changes:"Место: чистая площадка 3×3 м",steps:["Разложи своё лакомство на чистом участке.","«Ищи».","Следи, чтобы собака не подбирала постороннее."]}]},{id:"toy-search",title:"Поиск игрушки",category:"Интеллект",problem:"general",goal:"Собака ищет и приносит конкретную игрушку — развивает концентрацию и игровую мотивацию.",difficulty:2,durationMin:4,equipment:["Любимая игрушка"],steps:["Покажи игрушку, дай понюхать, скажи «Ищи игрушку».","Положи её так, чтобы собака видела, куда. Нашла — радостная игра.","Постепенно прячь сложнее: частично прикрыто, за предметом, в другой комнате.","Раунд удачен, если собака нашла игрушку сама."],mistakes:["Слишком сложное укрытие сразу","Длинные раунды без успеха","Забирать игрушку сразу после находки"],stressSigns:Ft,successCriterion:"Собака находит игрушку самостоятельно.",progression:"Две сессии от 80% — прячь сложнее или дальше.",simplify:"Игрушка на виду, ближе.",harder:"Укрытие сложнее, затем другая комната или площадка.",measurement:"attempts",unit:tv,successLabel:"Нашла",failLabel:"Не нашла",perUnitMin:1,minEvaluated:3,levels:[{n:1,title:"Игрушка на виду",changes:"Базовый уровень",steps:["Положи игрушку на виду.","«Ищи игрушку».","Нашла — игра."]},{n:2,title:"Частично прикрыта",changes:"Укрытие",steps:["Прикрой игрушку полотенцем.","«Ищи игрушку».","Нашла — игра."]},{n:3,title:"За предметом",changes:"Укрытие: не видно",steps:["Спрячь за дверью или коробкой.","«Ищи игрушку».","Нашла — игра."]},{n:4,title:"Другая комната или площадка",changes:"Площадь поиска",steps:["Спрячь в другой комнате.","«Ищи игрушку».","Нашла — большая игра."]}]},{id:"go-around",title:"Обход предмета",category:"Интеллект",problem:"general",goal:"Собака обходит предмет по жесту — развивает понимание направлений и работу на расстоянии.",difficulty:2,durationMin:4,equipment:["Конус, ведро или стул","Лакомство"],steps:["Встань рядом с предметом. Веди собаку лакомством вокруг предмета.","Обошла — «Да!» и награда.","Постепенно убери лакомство из руки, оставь жест, добавь слово «Обход».","Затем отходи от предмета на шаг, два и дальше."],mistakes:["Слишком большое расстояние сразу","Неясный жест","Долгие серии без награды"],stressSigns:Ft,successCriterion:"Собака обходит предмет по жесту и возвращается к хозяину.",progression:"Две сессии от 80% — убери подсказку или увеличь расстояние.",simplify:"Веди лакомством, стой ближе к предмету.",harder:"Только жест, затем расстояние 1–2 м, затем предмет на улице.",measurement:"attempts",unit:qa,successLabel:"Обошла",failLabel:"Не получилось",perUnitMin:.45,minEvaluated:6,levels:[{n:1,title:"С подсказкой лакомством",changes:"Базовый уровень",steps:["Веди лакомством вокруг предмета.","Обошла — «Да!».","Награда."]},{n:2,title:"Только жест",changes:"Подсказка: без лакомства в руке",steps:["Покажи жестом направление.","«Обход».","Обошла — награда."]},{n:3,title:"С расстояния 1–2 м",changes:"Расстояние",steps:["Отойди от предмета на 1–2 м.","Жест и «Обход».","Вернулась — награда."]},{n:4,title:"Дерево или столб на улице",changes:"Место: улица",steps:["Выбери дерево в тихом месте.","«Обход».","Награда у ноги."]}]},{id:"heel",title:"Движение рядом",category:"Поводок",problem:"leash",goal:"Собака идёт у ноги хозяина короткими отрезками — пригодится в узких местах и при встречах.",difficulty:2,durationMin:4,equipment:["Лакомство","Поводок"],steps:["Это не замена свободному поводку: «Рядом» — короткое точное движение, «гуляй» — свободное.","Держи лакомство у своего бедра. Скажи «Рядом» и сделай несколько шагов.","Собака идёт у ноги — награждай часто, прямо у бедра.","Отрезок удачен, если собака прошла его у ноги без натяжения.","После отрезка — «Гуляй» и свобода."],mistakes:["Длинные отрезки «Рядом» на всю прогулку","Подтягивать поводком","Редкие награды"],stressSigns:Ft,successCriterion:"Собака проходит отрезок у ноги без натяжения поводка.",progression:"Две сессии от 80% — удлини отрезок или добавь повороты.",simplify:"Меньше шагов, награда каждые 1–2 шага, дома.",harder:"Больше шагов, повороты, затем слабые отвлечения.",measurement:"segments",unit:Jf,successLabel:"У ноги",failLabel:"Ушла",perUnitMin:.5,minEvaluated:3,levels:[{n:1,title:"3–5 шагов дома",changes:"Базовый уровень",steps_hint:[3,5],steps:["«Рядом», 3–5 шагов.","Награда у бедра.","«Гуляй»."]},{n:2,title:"10 шагов во дворе",changes:"Длина и место",steps_hint:[8,10],steps:["«Рядом», 10 шагов.","Награда каждые 3 шага.","«Гуляй»."]},{n:3,title:"15 шагов на улице",changes:"Длина",steps_hint:[12,15],steps:["«Рядом», 15 шагов.","Награда каждые 4–5 шагов.","«Гуляй»."]},{n:4,title:"С поворотами",changes:"Повороты",steps_hint:[15,20],steps:["«Рядом» с поворотами.","Награда после поворота.","«Гуляй»."]}]},{id:"calm-waiting",title:"Спокойное ожидание",category:"Самоконтроль",problem:"general",goal:"Собака умеет спокойно постоять или по
