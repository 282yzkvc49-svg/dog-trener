"Ничего не говори, просто иди или стой.","Отмечай каждый добровольный взгляд «Да!».","Награждай щедро, это лучший навык прогулки."]}]},{id:"loose-leash",title:"Свободный поводок",category:"Поводок",problem:"leash",goal:"Собака идёт так, что поводок провисает, и сама возвращается к хозяину при натяжении.",difficulty:2,durationMin:5,equipment:["Шлейка","Поводок 2–3 м","Лакомство"],steps:["Начни в спокойном месте. Встань, дождись, пока поводок провиснет, отметь «Да!» и угости у своей ноги.","Пройди короткий отрезок — столько шагов, сколько указано в плане.","Пока поводок свободен, каждые несколько шагов отмечай и награждай у ноги.","Если поводок натянулся — остановись без рывка и жди. Как только собака ослабит натяжение или посмотрит на тебя — «Да!» и продолжай движение.","Если собака долго тянет в одну сторону, спокойно развернись и иди в другую.","Отрезок без натяжения — «Без натяжения». Было натяжение, которое пришлось останавливать, — «Было натяжение».","На обычной части прогулки разрешай обнюхивать: дай команду «Гуляй» и отпусти поводок на всю длину."],mistakes:["Дёргать поводок или тянуть собаку к себе","Идти вперёд, когда поводок натянут — это награждает тягу","Слишком длинные отрезки в начале","Тренировать, когда собака перевозбуждена или не гуляла"],stressSigns:[...Qt,"Тянет всё сильнее, хватает поводок зубами"],successCriterion:"Отрезок пройден без натяжения поводка (короткие провисания при остановке хозяина допустимы).",progression:"Две сессии подряд от 80% отрезков без натяжения — можно увеличить длину отрезка или перейти в обстановку чуть сложнее (что-то одно).",simplify:"Сократи отрезок до 3–5 шагов, вернись в тихое место, награждай чаще.",harder:"Удлини отрезок на 5–10 шагов, затем добавь слабые отвлечения — по одному параметру за раз.",measurement:"segments",unit:cf,successLabel:"Без натяжения",failLabel:"Было натяжение",perUnitMin:.6,minEvaluated:3,levels:[{n:1,title:"Короткие отрезки в тихом месте",changes:"Базовый уровень: 5–8 шагов",steps_hint:[5,8],steps:["Пройди 5–8 шагов.","Награждай у ноги каждые 2–3 шага.","Натяжение — остановка без рывка."]},{n:2,title:"Отрезки 10–15 шагов",changes:"Длина отрезка",steps_hint:[10,15],steps:["Пройди 10–15 шагов в тихом месте.","Награждай каждые 4–5 шагов.","Натяжение — стоп и ожидание."]},{n:3,title:"Отрезки 20–30 шагов",changes:"Длина отрезка",steps_hint:[20,30],steps:["Пройди 20–30 шагов.","Награждай за взгляд на тебя по пути.","Тянет в сторону — мягкий разворот."]},{n:4,title:"Рядом с умеренными отвлечениями",changes:"Отвлечения: люди и собаки на дистанции",steps_hint:[10,20],steps:["Выбери маршрут с прохожими вдалеке.","Отрезки по 10–20 шагов, награды чаще.","Раздражитель ближе комфортного — разворот."]},{n:5,title:"Новые маршруты",changes:"Место: незнакомые улицы",steps_hint:[15,30],steps:["Новый маршрут, сначала дай понюхать.","Отрезки по 15–30 шагов.","Награждай каждый добровольный взгляд."]}]},{id:"leave-it",title:"Команда «Оставь»",category:"Подбор с земли",problem:"pickup",goal:"Собака по сигналу отказывается от еды или предмета и смотрит на хозяина за другой наградой.",difficulty:1,durationMin:3,equipment:["Два вида лакомства: обычное и более ценное"],steps:["Обычное лакомство — «приманка», более ценное — награда. Награждай всегда другой рукой и другим лакомством.","Уровень 1: зажми приманку в кулаке и поднеси к собаке. Не говори ничего, пока она нюхает и лижет руку.","Как только собака отстранится или перестанет пытаться — «Да!» и награда из другой руки.","Когда собака отстраняется сразу, добавь слово «Оставь» перед тем, как предложить руку.","Дальше: открытая ладонь (закрывай, если собака тянется) → защищённое лакомство на полу (под ладонью или ногой) → незащищённое под контролем → безопасные тренировочные предметы на прогулке.","Попытка неудачна, если собака добралась до приманки или продолжает пытаться дольше 5 секунд."],mistakes:["Отдавать собаке ту самую приманку","Повторять «Оставь» много раз","Раскладывать настоящий мусор или найденную еду","Переходить на пол, пока кулак не даёт 80%"],stressSigns:Qt,successCriterion:"Собака отказывается от приманки в течение 3–5 секунд и не пытается взять её снова.",progression:"Две сессии подряд от 80% при минимум 8 попытках — переходи к следующему уровню (кулак → ладонь → пол).",simplify:"Вернись на предыдущий уровень (например, к закрытому кулаку), используй менее ароматную приманку.",harder:"Следующий уровень защищённости приманки, затем — другое место. Только безопасные тренировочные предметы.",measurement:"attempts",unit:Cc,successLabel:"Оставила",failLabel:"Не получилось",perUnitMin:.3,minEvaluated:8,safety:["Используй только своё лакомство и безопасные тренировочные предметы. Никаких экспериментов с мусором и найденной едой."],levels:[{n:1,title:"Закрытый кулак",changes:"Базовый уровень",steps:["Предложи собаке закрытый кулак с лакомством.","Дождись, когда она перестанет пытаться получить еду.","Отметь правильное поведение словом «Да!».","Награди другой рукой."]},{n:2,title:"Открытая ладонь",changes:"Защита: ладонь открыта, её можно закрыть",steps:["Покажи лакомство на открытой ладони, скажи «Оставь».","Тянется — спокойно закрой ладонь.","Отстранилась — «Да!» и награда другой рукой."]},{n:3,title:"Защищённое лакомство на полу",changes:"Место приманки: пол, ладонь или нога рядом",steps:["Положи лакомство на пол и прикрой ладонью или стопой.","«Оставь» — дождись, когда собака отвлечётся от приманки.","«Да!» и награда из руки, приманку убери сам."]},{n:4,title:"Лакомство на полу под контролем",changes:"Защита: приманка открыта, собака на поводке",steps:["Собака на поводке, приманка в 1 м, ты рядом и можешь прикрыть.","«Оставь» — ждём взгляд на тебя.","«Да!» и награда, приманку подними сам."]},{n:5,title:"Тренировочные предметы на прогулке",changes:"Место: улица, предметы разложены заранее",steps:["Заранее положи на маршрут безопасный предмет (свою игрушку, контейнер с лакомством).","Проходя мимо, скажи «Оставь».","Прошла мимо — «Да!» и щедрая награда."]}]},{id:"drop-it",title:"Команда «Дай» с обменом",category:"Подбор с земли",problem:"pickup",goal:"Собака охотно отпускает предмет из пасти в обмен на ценную награду — без насильственного извлечения.",difficulty:1,durationMin:3,equipment:["Две одинаковые игрушки или игрушка + очень ценное лакомство"],steps:["Дай собаке малоценную игрушку и немного поиграй.","Поднеси к носу очень ценное лакомство и скажи «Дай».","Как только собака разожмёт пасть — «Да!», отдай лакомство.","Верни игрушку: собака должна понять, что «Дай» не означает «потерять навсегда».","Никогда не разжимай пасть руками и не гоняйся за собакой с предметом — это учит убегать.","Неудача — если собака не отпустила предмет за 5 секунд. Не тяни: предложи лакомство ценнее или простую игрушку."],mistakes:["Вытаскивать предмет силой","Гоняться за собакой","Обмен только на «запретные» предметы — собака начнёт прятать находки","Слабая награда за ценный предмет"],stressSigns:[...Qt,"Застывает над предметом, рычит, убегает с ним"],successCriterion:"Собака отпускает предмет в течение 3 секунд после «Дай».",progression:"Две сессии от 80% — переходи к более ценному предмету или другому месту.",simplify:"Менее ценная игрушка, более ценная награда, тихое место дома.",harder:"Ценная игрушка, затем обмен на прогулке, затем обмен безопасной находки (палка, шишка).",measurement:"attempts",unit:Ee,successLabel:"Отдала",failLabel:"Не отдала",perUnitMin:.5,minEvaluated:5,safety:["Если собака рычит или застывает над предметом — прекрати упражнение и обратись к специалисту по поведению."],levels:[{n:1,title:"Малоценная игрушка дома",changes:"Базовый уровень",steps:["Дай игрушку, немного поиграй.","Ценное лакомство к носу — «Дай».","Отпустила — «Да!», лакомство, игрушку верни."]},{n:2,title:"Любимая игрушка",changes:"Ценность предмета",steps:["Любимая игрушка, короткая игра.","«Дай» и самое ценное лакомство.","Верни игрушку и продолжи игру."]},{n:3,title:"Обмен на прогулке",changes:"Место: улица",steps:["Возьми игрушку на прогулку.","«Дай» в тихом месте.","Награда и возврат игрушки."]},{n:4,title:"Безопасная находка",changes:"Предмет: палка, шишка",steps:["Собака подобрала палку или шишку.","«Дай» и сразу очень ценная награда.","Не ругай за находку — хвали за обмен."]}]},{id:"attention-switch",title:"Переключение внимания на хозяина",category:"Отвлечения",problem:"distractions",goal:"Собака может оторваться от интересного и переключиться на хозяина по кличке.",difficulty:2,durationMin:4,equipment:["Ценное лакомство","Игрушка-отвлечение"],steps:["Дождись, когда собака увлечётся чем-то (запах, игрушка на полу, человек вдалеке).","Произнеси кличку один раз.","Повернулась к тебе — «Да!», награда у твоей ноги или брось лакомство в сторону от раздражителя.","Не повернулась за 3 секунды — «Не получилось». Сделай шаг назад или отойди от раздражителя.","Иногда после награды отпускай собаку обратно к интересному: так переключение становится выгодным."],mistakes:["Звать, когда раздражитель слишком близко","Повторять кличку","Звать только чтобы уйти с интересного места"],stressSigns:[...Qt,...il],successCriterion:"Собака поворачивается к хозяину в течение 3 секунд после клички.",progression:"Две сессии подряд от 80% при 8 попытках — можно усложнить отвлечение или место.",simplify:"Слабее отвлечение, больше дистанция, ценнее награда.",harder:"Отвлечение ближе или интереснее, либо новое место — по одному.",measurement:"attempts",unit:Cc,successLabel:"Переключилась",failLabel:"Не переключилась",perUnitMin:.45,minEvaluated:8,levels:[{n:1,title:"Дома, слабое отвлечение",changes:"Базовый уровень",steps:["Положи игрушку на пол в 2 м.","Собака смотрит на неё — кличка.","Повернулась — «Да!» и награда."]},{n:2,title:"Тихое место на улице",changes:"Место: двор",steps:["Дай собаке увлечься запахом.","Кличка один раз.","Повернулась — «Да!» и награда."]},{n:3,title:"Люди вдалеке",changes:"Отвлечение: прохожие на дистанции",steps:["Встань на комфортной дистанции от людей.","Собака смотрит — кличка.","Повернулась — «Да!» и награда в сторону от людей."]},{n:4,title:"Собака на комфортной дистанции",changes:"Отвлечение: другая собака",steps:["Найди дистанцию, где собака замечает, но спокойна.","Кличка — «Да!» — награда.","Не слышит — отойди дальше."]},{n:5,title:"Движущиеся раздражители",changes:"Отвлечение: бегуны, велосипеды, играющие собаки",steps:["Только на дистанции, где собака думает.","Кличка — переключение — щедрая награда.","Стресс — уходим."]}]},{id:"calm-dogs",title:"Спокойная реакция на других собак",category:"Отвлечения",problem:"distractions",goal:"Собака спокойно замечает других собак и сама переключается на хозяина.",difficulty:3,durationMin:8,equipment:["Шлейка","Поводок","Очень ценное лакомство"],steps:["Найди место, где другие собаки видны издалека (край парка, площадка через дорогу).","Встань на дистанции, где твоя собака замечает другую собаку, но остаётся спокойной и берёт лакомство.","Собака посмотрела на другую собаку спокойно — «Да!» и награда. Так взгляд на собаку становится сигналом «посмотри на хозяина».","Через несколько повторов собака начнёт сама поворачиваться к тебе после взгляда — награждай особенно щедро.","Отметь в приложении дистанцию, реакцию и удалось ли переключиться.","Появился лай, рывок, замирание — увеличь дистанцию. Не подходи ближе и не заставляй смотреть.","Если подходящих собак не было — отметь «Не было встреч». Это не неудача."],mistakes:["Подходить ближе, «чтобы привыкала»","Ругать за лай","Работать дольше, чем собака сохраняет спокойствие","Позволять незнакомым собакам подходить вплотную"],stressSigns:[...Qt,...il],successCriterion:"Собака видит другую собаку без лая, рывка и замирания и переключается на хозяина.",progression:"Две сессии подряд от 80% спокойных наблюдений без сильных реакций — можно немного усложнить один параметр: длительность наблюдения или движение раздражителя.",simplify:"Увеличь дистанцию, выбирай неподвижных собак, сократи время наблюдения.",harder:"Сначала дольше наблюдать на той же дистанции, затем движущиеся собаки, затем — на 1–2 м ближе, только при полном спокойствии.",measurement:"observations",unit:os,successLabel:"Спокойно",failLabel:"Реакция",perUnitMin:2,minEvaluated:3,safety:["Никогда не приближайся к собаке, которая пугает твою. При частых сильных реакциях обратись к специалисту по поведению, работающему без аверсивных методов."],levels:[{n:1,title:"Большая дистанция, собака неподвижна",changes:"Базовый уровень: 30 м и больше",steps:["Найди спокойную дистанцию.","Взгляд на собаку — «Да!» и награда.","Отметь дистанцию и реакцию."]},{n:2,title:"Та же дистанция, наблюдение дольше",changes:"Длительность: 10–20 секунд",steps:["Оставайся на спокойной дистанции дольше.","Награждай каждый спокойный взгляд.","Уходи до того, как собака напряжётся."]},{n:3,title:"Движущиеся собаки",changes:"Раздражитель движется",steps:["Собаки гуляют на комфортной дистанции.","Взгляд — «Да!» — награда.","Напряглась — отойди."]},{n:4,title:"Немного ближе",changes:"Дистанция: на 1–2 м ближе комфортной",steps:["Только если собака полностью спокойна.","Короткое наблюдение и щедрая награда.","Первый признак напряжения — назад."]},{n:5,title:"Параллельная прогулка",changes:"Движение рядом на дистанции",steps:["Идите параллельно другой собаке на расстоянии.","Награждай спокойную ходьбу.","Не сближайтесь без необходимости."]}]},{id:"calm-people",title:"Спокойная реакция на людей",category:"Отвлечения",problem:"distractions",goal:"Собака спокойно проходит мимо людей, не прыгает и не тянется к ним.",difficulty:2,durationMin:6,equipment:["Шлейка","Поводок","Лакомство"],steps:["Начни там, где прохожие идут на расстоянии (через дорогу, по другой стороне аллеи).","Собака посмотрела на человека спокойно — «Да!» и награда.","Переключилась на тебя сама — щедрая награда.","Отмечай в приложении дистанцию, реакцию (рывок, лай, попытка подойти) и переключение.","Если собака рвётся к людям — увеличь дистанцию или сделай разворот.","Не позволяй незнакомцам гладить собаку во время тренировки — это награждает тягу к людям."],mistakes:["Разрешать здороваться с каждым прохожим","Стоять слишком близко к тропинке","Ругать за интерес к людям"],stressSigns:[...Qt,...il],successCriterion:"Человек прошёл мимо, собака не рванула и не прыгнула, переключилась на хозяина.",progression:"Две сессии подряд от 80% спокойных наблюдений — можно выбрать место, где люди проходят чуть ближе.",simplify:"Отойди дальше от тропинки, выбирай время с меньшим количеством людей.",harder:"Люди ближе, затем люди, которые останавливаются, — по одному параметру.",measurement:"observations",unit:os,successLabel:"Спокойно",failLabel:"Реакция",perUnitMin:1.6,minEvaluated:3,levels:[{n:1,title:"Люди вдалеке",changes:"Базовый уровень: 30 м и больше",steps:["Стой вдали от людей.","Спокойный взгляд — «Да!» и награда.","Отметь реакцию."]},{n:2,title:"Прохожие на другой стороне",changes:"Дистанция: 15–20 м",steps:["Встань у дороги, люди на другой стороне.","Награждай спокойное наблюдение.","Рвётся — отойди."]},{n:3,title:"Прохожие в 5–10 м",changes:"Дистанция: 5–10 м",steps:["Отойди от тропинки на 5–10 м.","Человек прошёл спокойно — «Да!» и награда.","Тянется — разворот."]},{n:4,title:"Мимо по тротуару",changes:"Движение навстречу",steps:["Иди по тротуару, держи собаку со стороны от людей.","Награждай спокойное прохождение.","Рывок — разворот, дистанция больше."]},{n:5,title:"Человек останавливается рядом",changes:"Человек стоит рядом",steps:["Знакомый человек стоит в 2–3 м без контакта.","Собака сидит или стоит спокойно — награда.","Прыгает — шаг назад, проще."]}]},{id:"u-turn",title:"Разворот на 180 градусов",category:"Отвлечения",problem:"distractions",goal:"По сигналу «Назад» собака разворачивается вместе с хозяином — безопасный уход от неожиданного раздражителя.",difficulty:1,durationMin:3,equipment:["Шлейка","Поводок","Лакомство"],steps:["Отрабатывай сначала дома в коридоре, затем в спокойном месте на улице.","Идите вместе. Скажи «Назад» весёлым голосом и развернись на 180°, держа лакомство у своей ноги.","Собака развернулась вслед за тобой без натяжения — «Да!» и награда через 2–3 шага.","Неудача — если пришлось тянуть собаку поводком. Не тяни: остановись и позови голосом.","Когда навык надёжен в спокойных условиях, используй его при появлении раздражителя."],mistakes:["Разворачивать рывком поводка","Использовать впервые сразу при встрече с собакой","Ругать, если собака замешкалась"],stressSigns:Qt,successCriterion:"Собака разворачивается вслед за хозяином в течение 2 секунд без натяжения поводка.",progression:"Две сессии от 80% при 5 повторах — переходи в обстановку на ступень сложнее.",simplify:"Вернись в коридор или тихий двор, подсказывай рукой с лакомством.",harder:"Неожиданный разворот на прогулке, затем — при раздражителе вдалеке.",measurement:"attempts",unit:Ee,successLabel:"Развернулась",failLabel:"Не получилось",perUnitMin:.45,minEvaluated:5,levels:[{n:1,title:"Дома в коридоре",changes:"Базовый уровень",steps:["Идите по коридору.","«Назад» и разворот с лакомством у ноги.","Развернулась — «Да!» и награда."]},{n:2,title:"Тихое место на улице",changes:"Место: улица без людей",steps:["Идите по пустой дорожке.","«Назад» — разворот.","«Да!» и награда через 2–3 шага."]},{n:3,title:"Неожиданно на прогулке",changes:"Время сигнала: без подготовки",steps:["Обычная прогулка, без предупреждения.","«Назад» — разворот.","Щедрая награда."]},{n:4,title:"При раздражителе вдалеке",changes:"Отвлечение: раздражитель на комфортной дистанции",steps:["Заметила собаку или человека вдалеке?","«Назад» — уходим.","«Да!» и награда после разворота."]}]},{id:"recall",title:"Подзыв «Ко мне»",category:"Подзыв",problem:"general",goal:"Собака быстро и охотно возвращается по команде «Ко мне», в том числе при отвлечениях.",difficulty:2,durationMin:4,equipment:["Шлейка","Длинный поводок 5–10 м","Очень ценное лакомство или игрушка"],steps:["На улице — только длинный поводок, закреплённый к шлейке, пока подзыв не надёжен.","Скажи «Ко мне» один раз радостным голосом, можешь присесть или отбежать назад.","Собака подбежала — «Да!» и награда у тебя в руках, лучше несколько лакомств подряд или игра.","Иногда возьми за шлейку на секунду и отпусти обратно гулять: подзыв не должен означать конец прогулки.","Неудача — если собака не пошла к тебе за 3 секунды. Не повторяй команду — подойди ближе, заинтересуй и попробуй в более простых условиях.","Никогда не наказывай за возвращение, даже если ждал долго."],mistakes:["Звать, когда собака точно не придёт","Ругать после возвращения","Звать только чтобы пристегнуть и уйти домой","Отпускать без поводка до надёжного навыка"],stressSigns:Qt,successCriterion:"Собака подбегает к хозяину в течение 3 секунд после одного сигнала.",progression:"Две сессии подряд от 80% при 5 повторах — увеличь дистанцию или добавь слабое отвлечение (одно).",simplify:"Короче дистанция, тихое место, награда ценнее, позови в момент, когда собака и так смотрит на тебя.",harder:"Длиннее поводок, затем слабые отвлечения, затем умеренные — всегда на длинном поводке.",measurement:"attempts",unit:Ee,successLabel:"Пришла",failLabel:"Не пришла",perUnitMin:.6,minEvaluated:5,safety:["На улице — длинный поводок и шлейка, пока нет надёжного подзыва и безопасного огороженного места. Не пристёгивай длинный поводок к ошейнику."],levels:[{n:1,title:"Тихое место, 2–3 м",changes:"Базовый уровень",steps:["Отойди на 2–3 м.","«Ко мне» один раз.","Пришла — «Да!» и щедрая награда."]},{n:2,title:"Длинный поводок 5 м",changes:"Дистанция: до 5 м",steps:["Длинный поводок к шлейке.","Дай отойти на 5 м, «Ко мне».","Награда и иногда — «Гуляй!» обратно."]},{n:3,title:"Длинный поводок 10 м",changes:"Дистанция: до 10 м",steps:["Собака гуляет на 10 м.","«Ко мне», можно отбежать назад.","Пришла — игра или 3 лакомства подряд."]},{n:4,title:"Слабые отвлечения",changes:"Отвлечение: запахи, люди вдалеке",steps:["Зови, когда собака нюхает.","Один сигнал, радостно.","Пришла — джекпот."]},{n:5,title:"Умеренные отвлечения",changes:"Отвлечение: собаки и люди на дистанции",steps:["Только на длинном поводке.","Зови, пока раздражитель далеко.","Не пришла — проще, а не громче."]}]},{id:"wait",title:"Выдержка «Жди»",category:"Самоконтроль",problem:"general",goal:"Собака спокойно остаётся на месте, пока хозяин не даст разрешение.",difficulty:1,durationMin:3,equipment:["Лакомство"],steps:["Посади или положи собаку, скажи «Жди», покажи ладонь.","Нажми «Старт» в приложении и выдержи паузу, указанную в плане.","Если собака осталась на месте — подойди, «Да!» и награда, затем слово-разрешение («Можно»).","Встала раньше времени — «Встала раньше», спокойно верни на место и сократи время.","Увеличивай по одному: время, расстояние или отвлечения."],mistakes:["Увеличивать время и расстояние одновременно","Звать собаку из выдержки (это путает с подзывом)","Забывать слово-разрешение"],stressSigns:Qt,successCriterion:"Собака остаётся на месте всю заданную выдержку.",progression:"Две сессии подряд от 80% — увеличь время выдержки на несколько секунд.",simplify:"Сократи время вдвое, стой ближе, тренируйся дома.",harder:"Дольше, затем шаг назад, затем лёгкие отвлечения — по одному.",measurement:"duration",unit:Ee,successLabel:"Выдержала",failLabel:"Встала раньше",perUnitMin:.4,minEvaluated:5,levels:[{n:1,title:"5 секунд рядом",changes:"Базовый уровень",seconds:5,steps:["«Жди», ладонь.","Выдержи 5 секунд рядом.","«Да!», награда, «Можно»."]},{n:2,title:"10 секунд",changes:"Время",seconds:10,steps:["«Жди».","10 секунд рядом.","Награда и разрешение."]},{n:3,title:"20 секунд",changes:"Время",seconds:20,steps:["«Жди».","20 секунд, ты рядом.","Награда и разрешение."]},{n:4,title:"30 секунд, шаг назад",changes:"Расстояние: 1–3 шага",seconds:30,steps:["«Жди», сделай 1–3 шага назад.","Выдержи 30 секунд.","Вернись к собаке, «Да!», награда."]},{n:5,title:"На улице при отвлечениях",changes:"Место: улица",seconds:30,steps:["Тихое место на улице.","«Жди» 30 секунд.","Вернись, награда, «Можно»."]}]},{id:"place",title:"Команда «Место»",category:"Самоконтроль",problem:"general",goal:"Собака идёт на коврик или лежанку и спокойно лежит там.",difficulty:2,durationMin:4,equipment:["Коврик или лежанка","Лакомство"],steps:["Положи коврик, подведи собаку к нему лакомством.","Любое касание коврика лапами — «Да!» и награда на коврике.","Когда собака сама встаёт на коврик, добавь слово «Место» и жди, пока ляжет.","Нажми «Старт» и выдерживай время, награждая спокойное лежание.","Встала с коврика без разрешения — «Встала раньше», спокойно верни."],mistakes:["Слишком долгое время в начале","Отправлять на место в наказание","Забывать разрешение уйти"],stressSigns:Qt,successCriterion:"Собака лежит на месте всё заданное время.",progression:"Две сессии от 80% — увеличь время или добавь бытовое отвлечение.",simplify:"Короче время, награждай чаще, ты ближе.",harder:"Дольше, затем отойди, затем бытовые отвлечения.",measurement:"duration",unit:Ee,successLabel:"Лежала",failLabel:"Встала раньше",perUnitMin:.8,minEvaluated:5,levels:[{n:1,title:"Зайти на коврик",changes:"Базовый уровень",seconds:5,steps:["Подведи к коврику.","Касание — «Да!» и награда.","Повтори."]},{n:2,title:"Лечь на 10 секунд",changes:"Время",seconds:10,steps:["«Место».","Легла — выдержи 10 секунд.","Награда на коврике."]},{n:3,title:"30 секунд, ты рядом",changes:"Время",seconds:30,steps:["«Место».","30 секунд, награждай спокойствие.","Разрешение."]},{n:4,title:"1 минута, ты отходишь",changes:"Расстояние",seconds:60,steps:["«Место».","Отойди на 2–3 шага.","Вернись и награди."]},{n:5,title:"2 минуты с бытовыми отвлечениями",changes:"Отвлечения дома",seconds:120,steps:["«Место».","Занимайся делами рядом.","Награждай спокойное лежание."]}]},{id:"treat-search",title:"Поиск лакомств",category:"Интеллект",problem:"general",goal:"Нюхательная работа успокаивает, утомляет «головой» и даёт собаке законный способ искать еду.",difficulty:1,durationMin:5,equipment:["Лакомство или часть корма","Нюхательный коврик (по желанию)"],steps:["Скажи «Ищи» и разложи несколько лакомств на виду.","Когда собака находит их уверенно, прячь сложнее: в траву, под коробку, в нюхательный коврик.","Раунд удачен, если собака нашла всё сама за 1–2 минуты.","Это спокойное занятие: не торопи и не подсказывай без необходимости.","На улице раскладывай только своё лакомство на чистом участке."],mistakes:["Слишком сложные тайники в начале","Подсказывать каждое лакомство","Раскладывать там, где есть мусор"],stressSigns:Qt,successCriterion:"Собака находит все лакомства самостоятельно за 1–2 минуты.",progression:"Две сессии от 80% — усложни тайники или площадь поиска.",simplify:"Лакомства на виду, меньшая площадь.",harder:"Тайники сложнее, затем поиск на улице.",measurement:"attempts",unit:df,successLabel:"Нашла всё",failLabel:"Не нашла",perUnitMin:1.5,minEvaluated:3,levels:[{n:1,title:"Лакомства на виду",changes:"Базовый уровень",steps:["Разложи 5–6 лакомств на полу.","«Ищи».","Нашла все — хвали."]},{n:2,title:"Коврик или трава",changes:"Сложность тайника",steps:["Лакомства в нюхательном коврике или траве.","«Ищи».","Не подсказывай."]},{n:3,title:"Спрятанные в комнате",changes:"Площадь: комната",steps:["Спрячь 5 лакомств в комнате.","«Ищи».","Хвали за каждую находку."]},{n:4,title:"Площадка на улице",changes:"Место: чистая площадка 3×3 м",steps:["Разложи своё лакомство на чистом участке.","«Ищи».","Следи, чтобы собака не подбирала постороннее."]}]},{id:"toy-search",title:"Поиск игрушки",category:"Интеллект",problem:"general",goal:"Собака ищет и приносит конкретную игрушку — развивает концентрацию и игровую мотивацию.",difficulty:2,durationMin:4,equipment:["Любимая игрушка"],steps:["Покажи игрушку, дай понюхать, скажи «Ищи игрушку».","Положи её так, чтобы собака видела, куда. Нашла — радостная игра.","Постепенно прячь сложнее: частично прикрыто, за предметом, в другой комнате.","Раунд удачен, если собака нашла игрушку сама."],mistakes:["Слишком сложное укрытие сразу","Длинные раунды без успеха","Забирать игрушку сразу после находки"],stressSigns:Qt,successCriterion:"Собака находит игрушку самостоятельно.",progression:"Две сессии от 80% — прячь сложнее или дальше.",simplify:"Игрушка на виду, ближе.",harder:"Укрытие сложнее, затем другая комната или площадка.",measurement:"attempts",unit:df,successLabel:"Нашла",failLabel:"Не нашла",perUnitMin:1,minEvaluated:3,levels:[{n:1,title:"Игрушка на виду",changes:"Базовый уровень",steps:["Положи игрушку на виду.","«Ищи игрушку».","Нашла — игра."]},{n:2,title:"Частично прикрыта",changes:"Укрытие",steps:["Прикрой игрушку полотенцем.","«Ищи игрушку».","Нашла — игра."]},{n:3,title:"За предметом",changes:"Укрытие: не видно",steps:["Спрячь за дверью или коробкой.","«Ищи игрушку».","Нашла — игра."]},{n:4,title:"Другая комната или площадка",changes:"Площадь поиска",steps:["Спрячь в другой комнате.","«Ищи игрушку».","Нашла — большая игра."]}]},{id:"go-around",title:"Обход предмета",category:"Интеллект",problem:"general",goal:"Собака обходит предмет по жесту — развивает понимание направлений и работу на расстоянии.",difficulty:2,durationMin:4,equipment:["Конус, ведро или стул","Лакомство"],steps:["Встань рядом с предметом. Веди собаку лакомством вокруг предмета.","Обошла — «Да!» и награда.","Постепенно убери лакомство из руки, оставь жест, добавь слово «Обход».","Затем отходи от предмета на шаг, два и дальше."],mistakes:["Слишком большое расстояние сразу","Неясный жест","Долгие серии без награды"],stressSigns:Qt,successCriterion:"Собака обходит предмет по жесту и возвращается к хозяину.",progression:"Две сессии от 80% — убери подсказку или увеличь расстояние.",simplify:"Веди лакомством, стой ближе к предмету.",harder:"Только жест, затем расстояние 1–2 м, затем предмет на улице.",measurement:"attempts",unit:Ee,successLabel:"Обошла",failLabel:"Не получилось",perUnitMin:.45,minEvaluated:6,levels:[{n:1,title:"С подсказкой лакомством",changes:"Базовый уровень",steps:["Веди лакомством вокруг предмета.","Обошла — «Да!».","Награда."]},{n:2,title:"Только жест",changes:"Подсказка: без лакомства в руке",steps:["Покажи жестом направление.","«Обход».","Обошла — награда."]},{n:3,title:"С расстояния 1–2 м",changes:"Расстояние",steps:["Отойди от предмета на 1–2 м.","Жест и «Обход».","Вернулась — награда."]},{n:4,title:"Дерево или столб на улице",changes:"Место: улица",steps:["Выбери дерево в тихом месте.","«Обход».","Награда у ноги."]}]},{id:"heel",title:"Движение рядом",category:"Поводок",problem:"leash",goal:"Собака идёт у ноги хозяина короткими отрезками — пригодится в узких местах и при встречах.",difficulty:2,durationMin:4,equipment:["Лакомство","Поводок"],steps:["Это не замена свободному поводку: «Рядом» — короткое точное движение, «гуляй» — свободное.","Держи лакомство у своего бедра. Скажи «Рядом» и сделай несколько шагов.","Собака идёт у ноги — награждай часто, прямо у бедра.","Отрезок удачен, если собака прошла его у ноги без натяжения.","После отрезка — «Гуляй» и свобода."],mistakes:["Длинные отрезки «Рядом» на всю прогулку","Подтягивать поводком","Редкие награды"],stressSigns:Qt,successCriterion:"Собака проходит отрезок у ноги без натяжения поводка.",progression:"Две сессии от 80% — удлини отрезок или добавь повороты.",simplify:"Меньше шагов, награда каждые 1–2 шага, дома.",harder:"Больше шагов, повороты, затем слабые отвлечения.",measurement:"segments",unit:cf,successLabel:"У ноги",failLabel:"Ушла",perUnitMin:.5,minEvaluated:3,levels:[{n:1,title:"3–5 шагов дома",changes:"Базовый уровень",steps_hint:[3,5],steps:["«Рядом», 3–5 шагов.","Награда у бедра.","«Гуляй»."]},{n:2,title:"10 шагов во дворе",changes:"Длина и место",steps_hint:[8,10],steps:["«Рядом», 10 шагов.","Награда каждые 3 шага.","«Гуляй»."]},{n:3,title:"15 шагов на улице",changes:"Длина",steps_hint:[12,15],steps:["«Рядом», 15 шагов.","Награда каждые 4–5 шагов.","«Гуляй»."]},{n:4,title:"С поворотами",changes:"Повороты",steps_hint:[15,20],steps:["«Рядом» с поворотами.","Награда после поворота.","«Гуляй»."]}]},{id:"calm-waiting",title:"Спокойное ожидание",category:"Самоконтроль",problem:"general",goal:"Собака умеет спокойно постоять или полежать рядом, пока хозяин ждёт (у подъезда, на скамейке, у перехода).",difficulty:2,durationMin:4,equipment:["Коврик (по желанию)","Лакомство"],steps:["Остановись в тихом месте. Стой или сядь на скамейку, поводок свободен.","Нажми «Старт». Награждай спокойное поведение: стоит, сидит, лежит, нюхает землю рядом.","Не требуй команд — важно спокойствие, а не поза.","Удачно, если собака провела заданное время спокойно, без скулежа и попыток утянуть."],mistakes:["Ждать слишком долго в начале","Выбирать людное место раньше времени","Не замечать спокойствие и не награждать"],stressSigns:Qt,successCriterion:"Собака спокойно проводит заданное время рядом с хозяином.",progression:"Две сессии от 80% — увеличь время или выбери место оживлённее.",simplify:"Короче время, тише место, награды чаще.",harder:"Дольше, затем оживлённее место.",measurement:"duration",unit:Ee,successLabel:"Спокойно",failLabel:"Не выдержала",perUnitMin:1,minEvaluated:3,levels:[{n:1,title:"1 минута в тихом месте",changes:"Базовый уровень",seconds:60,steps:["Встань в тихом месте.","Награждай спокойствие.","Через минуту — «Пошли»."]},{n:2,title:"2 минуты",changes:"Время",seconds:120,steps:["То же место.","2 минуты, награды реже.","«Пошли»."]},{n:3,title:"3 минуты при слабых отвлечениях",changes:"Отвлечения",seconds:180,steps:["Место, где иногда проходят люди.","Награждай спокойные взгляды.","«Пошли»."]},{n:4,title:"5 минут в оживлённом месте",changes:"Время и место",seconds:300,steps:["Скамейка на краю оживлённого места.","Награждай спокойствие.","Стресс — уходим."]}]},{id:"play-focus",title:"Игровая концентрация",category:"Внимание",problem:"general",goal:"Собака умеет выключиться из игры, выполнить знакомую команду и снова включиться — тренирует самоконтроль при возбуждении.",difficulty:2,durationMin:4,equipment:["Игрушка-перетяжка или мяч"],steps:["Поиграй с собакой 10–15 секунд.","Остановись, замри с игрушкой у груди и дай знакомую команду («Сидеть», «Лежать» или «Жди»).","Выполнила — «Да!» и награда продолжением игры.","Неудача — если собака не выполнила команду за 5 секунд. Сделай паузу, игру тише."],mistakes:["Слишком бурная игра до команды","Команда сразу на пике возбуждения","Заканчивать игру после каждого успеха"],stressSigns:[...Qt,"Хватает руки, не может остановиться"],successCriterion:"Собака выполняет команду в течение 5 секунд после остановки игры.",progression:"Две сессии от 80% — игру интенсивнее или команду сложнее.",simplify:"Спокойнее игра, проще команда («Сидеть»).",harder:"Интенсивнее игра, затем «Жди» в игре, затем на улице.",measurement:"attempts",unit:Cc,successLabel:"Выполнила",failLabel:"Не смогла",perUnitMin:.6,minEvaluated:6,levels:[{n:1,title:"Спокойная игра → «Сидеть»",changes:"Базовый уровень",steps:["Поиграй 10 секунд спокойно.","Замри, «Сидеть».","Села — игра продолжается."]},{n:2,title:"Активная игра → «Лежать»",changes:"Интенсивность игры",steps:["Активная игра 15 секунд.","Замри, «Лежать».","Легла — игра."]},{n:3,title:"Игра → «Жди» 3 секунды",changes:"Команда сложнее",steps:["Активная игра.","«Жди» 3 секунды.","Выдержала — игра."]},{n:4,title:"Игра на улице",changes:"Место: улица",steps:["Игра на длинном поводке в тихом месте.","Замри, знакомая команда.","Выполнила — игра."]}]},{id:"direction-change",title:"Движение с изменением направления",category:"Поводок",problem:"leash",goal:"Собака следит за хозяином и легко меняет направление вслед за ним без натяжения.",difficulty:1,durationMin:4,equipment:["Шлейка","Поводок","Лакомство"],steps:["Иди в одном направлении, затем скажи «Пошли» и плавно поверни (90° или в обратную сторону).","Собака последовала за тобой без натяжения — «Да!» и награда у ноги.","Неудача — если поводок натянулся и собаку пришлось ждать или звать.","Меняй направление часто и непредсказуемо: собака учится следить за тобой."],mistakes:["Резкий рывок при повороте","Слишком редкие повороты","Отсутствие сигнала «Пошли»"],stressSigns:Qt,successCriterion:"Собака меняет направление вслед за хозяином без натяжения.",progression:"Две сессии от 80% — перенеси на улицу или добавь отвлечения.",simplify:"Плавные повороты, чаще награда, тихое место.",harder:"Неожиданные повороты, затем при слабых отвлечениях.",measurement:"attempts",unit:Ee,successLabel:"Пошла следом",failLabel:"Натяжение",perUnitMin:.4,minEvaluated:6,levels:[{n:1,title:"Двор или дом",changes:"Базовый уровень",steps:["«Пошли» и плавный поворот.","Пошла следом — «Да!».","Награда у ноги."]},{n:2,title:"Улица без отвлечений",changes:"Место",steps:["Тихая улица.","Поворот на 90° или назад.","Награда."]},{n:3,title:"Слабые отвлечения",changes:"Отвлечения",steps:["Обычная прогулка.","Неожиданный поворот.","Награда у ноги."]},{n:4,title:"Зигзаг",changes:"Частота поворотов",steps:["Повороты каждые 5–10 шагов.","Каждый удачный — награда.","Затем «Гуляй»."]}]},{id:"ground-refusal",title:"Отказ от предмета на земле",category:"Подбор с земли",problem:"pickup",goal:"Собака проходит мимо еды и предметов на земле, не пытаясь их подобрать.",difficulty:3,durationMin:5,equipment:["Свои безопасные приманки: лакомство в контейнере, тренировочная игрушка","Ценное лакомство для награды","Поводок"],steps:["Перед тренировкой разложи на маршруте свои безопасные приманки. Ничего найденного на улице не используй.","Иди мимо приманки на поводке так, чтобы собака не могла до неё дотянуться.","Собака заметила приманку и прошла мимо (или посмотрела на тебя) — «Да!» и щедрая награда из руки.","Если собака тянется — остановись, не давая дотянуться, скажи «Оставь», дождись отказа и награди. Такая попытка — «Не получилось».","После тренировки собери все приманки.","При подозрении, что собака проглотила что-то опасное на обычной прогулке, сразу свяжись с ветеринаром."],mistakes:["Использовать настоящий мусор или подозрительную еду","Проходить слишком близко к приманке","Ругать вместо того, чтобы награждать отказ"],stressSigns:Qt,successCriterion:"Собака проходит мимо приманки, не пытаясь её взять.",progression:"Две сессии подряд от 80% при 8 попытках — уменьшай дистанцию до приманки или перех
